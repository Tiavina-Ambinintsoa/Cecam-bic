name: bic-cecam

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Renseignez POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?Renseignez POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - bic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./bic-backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?Renseignez POSTGRES_DB dans .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Renseignez POSTGRES_USER dans .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Renseignez APP_JWT_SECRET dans .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./bic-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${BIC_HTTP_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bic-postgres-data:
