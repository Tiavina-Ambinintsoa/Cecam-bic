server:
  port: 8080

spring:
  application:
    name: bic-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/bic_cecam
    username: bic_user
    password: admin123
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

spring.sql.init.data-locations: classpath:data.sql, classpath:data-crif.sql, classpath:data-crif-fianarantsoa.sql

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}"
  jwt:
    secret: change-this-secret-key-in-production-please-make-it-long-and-random-1234567890
    expiration-ms: 28800000 

  score:
    score-base: 300
    score-max: 850

    # Poids relatifs des facteurs réellement évalués
    poids-paiement: 290
    poids-arrieres-en-cours: 60
    poids-endettement: 35
    poids-exposition: 25
    poids-budget: 30

    # Comportement de paiement
    observations-pleine-confiance: 12
    fenetre-confiance-mois: 36
    plancher-confiance: 0.50
    poids-recent: 1.00
    poids-moyen: 0.60
    poids-ancien: 0.30
    qualite-paye-a-temps: 1.00
    qualite-retard-court: 0.72       # décote graduelle 1-29j via la méthode qualite()
    qualite-retard-long: 0.15        # à 30j ; décroît linéairement jusqu'à 0 à 180j
    qualite-impaye: 0.00
    tolerance-retard-jours: 5        # tolérance avant de considérer un retard (0 = pas de grâce)

    # Arriérés en cours (part des points conservée)
    ratio-arrieres1a29: 0.35         # graduel : voir ScoreService.qualiteArriere()
    ratio-arrieres30a59: 0.20
    # Bonus/malus déclarés (limités à des petits ajustements)
    bonus-anticipation-par-contrat: 10
    bonus-anticipation-max: 20
    malus-retard-declare-par-contrat: 15
    malus-retard-declare-avec-historique: 10

    # Capacité de remboursement
    endettement-seuil-vert: 0.30
    endettement-seuil-rouge: 0.80
    exposition-seuil-vert: 0.15
    exposition-seuil-rouge: 0.60

    # Plafonds de décision
    plafond-sans-capacite: 529
    plafond-sans-historique: 499
    plafond-classe-b: 529
    plafond-classe-c: 499
    plafond-historique-declare: 499
    plafond-credit-non-rembourse: 399
    plafond-bande-tres-eleve: 399
    plafond-charge12-mois-sup100: 459
    plafond-charge12-mois-sup80: 499
    exposition-plafond-ratio: 1.50
    plafond-exposition-excessive: 459
    plafond-arrieres30: 499
    plafond-arrieres60: 459
    plafond-arrieres90: 399
    plafond-budget-critique: 399
    plafond-budget-faible: 459

    # Risque de groupe
    malus-par-co-oblige-a-risque: 20
    malus-co-obliges-max: 60
