server:
  port: 8080

spring:
  application:
    name: bic-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/bic_cecam
    username: bic_user
    password: admin123
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

spring.sql.init.data-locations: classpath:data.sql, classpath:data-crif.sql, classpath:data-crif-fianarantsoa.sql

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}"
  jwt:
    secret: change-this-secret-key-in-production-please-make-it-long-and-random-1234567890
    expiration-ms: 28800000 

  score:
    score-base: 300
    score-max: 850

    max-paiement: 240
    max-endettement: 45
    max-exposition: 25
    max-anciennete: 35
    max-nouveaux: 20
    max-mixite: 15

    maturite-mois: 36       
    plancher-confiance: 0.50
    poids-recent: 1.00          
    poids-moyen: 0.60        
    poids-ancien: 0.30           
    qualite-paye-a-temps: 1.00
    qualite-retard-court: 0.50   
    qualite-retard-long: 0.15     
    qualite-impaye: 0.00          

    endettement-seuil-vert: 0.33
    endettement-seuil-rouge: 0.70
    malus-surendettement-coef: 60
    malus-surendettement-max: 90

    exposition-seuil-vert: 0.15
    exposition-seuil-rouge: 0.60

    anciennete-mois-plein: 84

    malus-par-contrat-recent: 8
    malus-par-demande-en-attente: 12
    fenetre-contrat-recent-mois: 12
    seuil-demande-en-attente-jours: 60

    mixite-ratio-deux-types: 0.60
    mixite-ratio-un-type: 0.20

    plafond-secondaire-base: 0.30
    plafond-secondaire-part: 0.35

    neutre-sans-revenu: 0.0
