server:
  port: 8080

spring:
  application:
    name: bic-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/bic_cecam
    username: bic_user
    password: admin123
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

spring.sql.init.data-locations: classpath:data.sql, classpath:data-crif.sql

app:
  jwt:
    secret: change-this-secret-key-in-production-please-make-it-long-and-random-1234567890
    expiration-ms: 28800000  # 8h

  score:
    score-base: 300
    score-max: 850

    # --- Poids des six axes (somme = 550) ---
    max-paiement: 200
    max-endettement: 120
    max-exposition: 100
    max-anciennete: 60
    max-nouveaux: 40
    max-mixite: 30

    # --- Comportement de paiement ---
    maturite-echeances: 36        # nb d'échéances échues pour une confiance pleine
    plancher-confiance: 0.50
    poids-recent: 1.00            # échéance de moins de 12 mois
    poids-moyen: 0.60             # de 12 à 36 mois
    poids-ancien: 0.30            # au-delà de 36 mois
    qualite-paye-a-temps: 1.00
    qualite-retard-court: 0.50    # payée avec 30 jours de retard ou moins
    qualite-retard-long: 0.15     # payée avec plus de 30 jours de retard
    qualite-impaye: 0.00          # échue et toujours non soldée

    # --- Endettement : charge mensuelle / revenu mensuel ---
    endettement-seuil-vert: 0.33
    endettement-seuil-rouge: 0.70
    malus-surendettement-coef: 60
    malus-surendettement-max: 90

    # --- Exposition : engagement total / revenu annuel ---
    exposition-seuil-vert: 0.25
    exposition-seuil-rouge: 0.75

    # --- Ancienneté ---
    anciennete-mois-plein: 84

    # --- Appétit de crédit récent ---
    malus-par-contrat-recent: 8
    malus-par-demande-en-attente: 12
    fenetre-contrat-recent-mois: 12
    seuil-demande-en-attente-jours: 60

    # --- Mixité ---
    mixite-ratio-deux-types: 0.60
    mixite-ratio-un-type: 0.20

    # --- Plafonnement des axes secondaires par la qualité de paiement ---
    # Ancienne formule : 0,40 + 0,60 x ratio. Elle écrêtait systématiquement
    # et réduisait le score à une fonction du seul axe paiement.
    plafond-secondaire-base: 0.70
    plafond-secondaire-part: 0.30

    # --- Valeur neutre des axes financiers si le revenu n'est pas déclaré ---
    neutre-sans-revenu: 0.60