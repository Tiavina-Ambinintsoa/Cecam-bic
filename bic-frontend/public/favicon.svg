<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cecamBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#009fe3"/>
    </linearGradient>
  </defs>

  <!-- Fond bleu institutionnel CECAM avec coins arrondis -->
  <rect width="128" height="128" rx="26" fill="url(#cecamBlue)"/>

  <!-- Cadre intérieur blanc stylisé -->
  <rect x="10" y="10" width="108" height="108" rx="8" fill="none" stroke="#ffffff" stroke-width="3.5"/>

  <!-- 5 barres rayonnantes blanches à droite du cône CECAM -->
  <rect x="92" y="24" width="16" height="11" rx="1.5" fill="#ffffff"/>
  <rect x="92" y="40" width="16" height="11" rx="1.5" fill="#ffffff"/>
  <rect x="92" y="56" width="16" height="11" rx="1.5" fill="#ffffff"/>
  <rect x="92" y="72" width="16" height="11" rx="1.5" fill="#ffffff"/>
  <rect x="92" y="88" width="16" height="11" rx="1.5" fill="#ffffff"/>

  <!-- Corps principal du cône / corne d'abondance CECAM -->
  <!-- Forme trapézoïdale blanche élargie vers la droite avec nez courbé à gauche -->
  <path d="M 88 20 
           L 54 27 
           C 28 32, 16 50, 16 64 
           C 16 78, 28 96, 54 101 
           L 88 108 
           Z" 
        fill="#ffffff"/>

  <!-- Acronyme CECAM gravé au centre en bleu institutionnel -->
  <text x="51" y="72" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="#0284c7">CECAM</text>
</svg>
